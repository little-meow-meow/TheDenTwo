- type: entity
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  name: Urist McRaptor
  components:
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#ccac1f"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Speech
    speechSounds: SpeechResomiMale
    speechVerb: Parrot
    allowedEmotes: [ "Chirp" ]
  - type: TypingIndicator
    #proto: vulpkanin # TODO!: Need prototype and sprites
  - type: Vocal
    emoteSounds: MaleResomi
  - type: Damageable
    damageModifierSet: Resomi
  - type: Temperature
    currentTemperature: 310.15  # 37°C
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 320.15  # 47°C
    coldDamageThreshold: 196.15  # -77°C
  - type: TemperatureSpeed
    thresholds:
      273: 0.9  #  -0.15°C
      260: 0.8  # -20.15°C
      230: 0.7  # -43.15°C
  - type: ThermalRegulator
    # TODO!: Other thermal regulator tweaks?
    thermalRegulationTemperatureThreshold: 25
  - type: TemperatureProtection
    heatingCoefficient: 1.1
    coolingCoefficient: 0.3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 300
  - type: PhysiologyDescription
    baseLabel: physiology-description-species-base-resomi
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_vulpkanin # TODO!: Need sprite
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5
    weightlessModifier: 1.1
    weightlessFriction: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      180: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  # TODO!: PseudoItem for duffelbag insertion

